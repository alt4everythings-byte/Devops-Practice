services:
  app:
    build: ..
    ports:
      - "5000:80"
    depends_on:
      - redis
  redis:
    image: redis:alpine
    volumes:
      - redis-data:/data
  redis-commander:
    image: rediscommander/redis-commander:latest
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis
volumes:
  redis-data:
